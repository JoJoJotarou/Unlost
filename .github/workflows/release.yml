name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/unlost.zip
          if-no-files-found: error
      - uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.1.3
      - name: Sign zip
        run: cosign sign-blob --yes --bundle dist/unlost.zip.bundle dist/unlost.zip
      - name: Attach zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/unlost.zip dist/unlost.zip.bundle --clobber

  chrome-web-store:
    name: Chrome Web Store
    needs:
      - release-please
      - publish
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension
          path: dist
      - uses: hamzahamidi/publish-to-chrome-web-store@v1
        with:
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          item-id: ${{ vars.CWS_ITEM_ID }}
          zip: dist/unlost.zip
          publish: false
